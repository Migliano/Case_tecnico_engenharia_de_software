<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Projeto Cadastro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>Faça seu Cadastro!</h2>
    <form id="formCadastro" onsubmit="enviarCadastro(event)">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf">

        <label for="email">Email</label>
        <input type="text" id="email">

        <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" id="data_nascimento">

        <label for="cep">CEP</label>
        <!-- onblur dispara quando o usuário tira o foco do campo (Tab tmb funciona). 
         passando document.getElementById('cep').value em vez de só 'cep' pq dentro de um atributo HTML, 'cep' não existe como variável JS 
         então tem que buscar o elemento pelo id e extrair o .value na mão -->
        <input type="text" id="cep" onblur="buscarLogradouro(document.getElementById('cep').value)">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco">

        <button type="submit">Enviar!</button>

        <!-- getElementById pega um único elemento pelo id (que tem que ser único na página inteira) e retorna esse elemento direto.
             getElementsByClassName retornaria uma coleção de elementos (porque class pode repetir) — teria que fazer [0] pra acessar o primeiro-->
        <div id="resultado"></div>   <!-- esse mostra o login na tela-->
    </form>
    <script src="script.js"></script>
  </body>
</html>
