<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"><!-- importa o olhinho de ocultar o login-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- importa bootstrap-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Projeto Cadastro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id='tela_boasvindas' class='container_formulario'>
    <h2>Bem-vindo ao Sistema de Cadastro</h2>
    <h5>Gere seu login único com segurança e praticidade</h5>
    <button id= 'botaoFazer_meu_cadastro' onclick = 'irParaCadastro()' class = 'btn btn-primary' type = 'button'>
      Fazer meu cadastro ➞
    </button>
    </div>

    <div id="tela_cadastro" class = "container_formulario" style="display:none"> <!--Display troca quem esta aparecendo. no IU.JS que ele é alternado-->
      <img src="logo_tela_login.png" alt="logo" style="width: 80px; margin-bottom: 10px;">
      <h2>Faça seu Cadastro!</h2>
      <form id="formCadastro" onsubmit="enviarCadastro(event)">

          <div class="form-floating mb-3">
            <input type="text" id="nome" class="form-control" placeholder="Nome Completo">
            <label for="nome">Nome Completo</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" id="cpf" class="form-control" placeholder="CPF">
            <label for="cpf">CPF</label>
          </div>

          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com"> <!-- o placeholder não esta aparecendo por causa do mb-3, mas se eu tiro ele apra de funcionar o mb-3, então deixa assim-->
            <label for="email">Endereço de Email</label>
          </div>

          <div class="form-floating mb-3">
            <input type="date" class="form-control" id="data_nascimento" placeholder="Data de Nascimento">
            <label for="data_nascimento">Data de Nascimento</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="cep" placeholder="CEP" onblur="buscarLogradouro(document.getElementById('cep').value)">
            <!-- onblur dispara quando o usuário tira o foco do campo (Tab tmb funciona). 
          passando document.getElementById('cep').value em vez de só 'cep' pq dentro de um atributo HTML, 'cep' não existe como variável JS 
          então tem que buscar o elemento pelo id e extrair o .value na mão -->
            <label for="cep">CEP</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" id="endereco" class="form-control" placeholder="Endereço">
            <label for="endereco">Endereço</label>
            <div class="form-text">Seus dados estão seguros conosco!</div>
          </div>

          <button class="btn btn-primary" id="botao_enviar" type="submit">Enviar!</button>

          <!-- getElementById pega um único elemento pelo id (que tem que ser único na página inteira) e retorna esse elemento direto.
              getElementsByClassName retornaria uma coleção de elementos (porque class pode repetir) — teria que fazer [0] pra acessar o primeiro-->
          <div id="resultado" class = "mt-3"> <!-- esse mostra o login na tela-->
            <span id="seu_login" style="display:none">Seu login: </span>
            <span id="login_texto"></span>
            <button type="button" id="botao_olho" onclick="mostrarLogin()" style="display:none">
              <i class="bi bi-eye"></i>
            </button>
          </div>   
      </form>
    </div>
    <script src="ui.js"></script>
    <script src="script.js"></script>
  </body>
</html>
